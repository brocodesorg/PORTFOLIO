<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgEco" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041814"/>
      <stop offset="100%" stop-color="#06241D"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="ecoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgEco)"/>

  <!-- Topographic Contour Curves -->
  <g stroke="#10B981" stroke-width="1.5" opacity="0.25">
    <ellipse cx="400" cy="250" rx="320" ry="170"/>
    <ellipse cx="400" cy="250" rx="240" ry="130"/>
    <ellipse cx="400" cy="250" rx="160" ry="90"/>
    <ellipse cx="400" cy="250" rx="90" ry="50"/>
  </g>

  <!-- Orbital Rings & Planetary Telemetry -->
  <circle cx="400" cy="250" r="140" stroke="#06B6D4" stroke-width="2" stroke-dasharray="10 14" opacity="0.4"/>
  <circle cx="400" cy="250" r="30" fill="url(#emeraldGrad)" filter="url(#ecoGlow)"/>

  <!-- Satellite Sensor Tracks -->
  <path d="M120 380 Q 400 100 680 380" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#ecoGlow)"/>
  
  <circle cx="280" cy="200" r="10" fill="#34D399" filter="url(#ecoGlow)"/>
  <circle cx="520" cy="200" r="10" fill="#22D3EE" filter="url(#ecoGlow)"/>

  <!-- UI Badges -->
  <g transform="translate(60, 60)">
    <rect width="230" height="56" rx="8" fill="#0A2822" stroke="#047857" stroke-width="1.5"/>
    <text x="20" y="24" fill="#34D399" font-family="monospace" font-size="11" font-weight="600">CARBON OFFSET VERIFIED</text>
    <text x="20" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">14.2M TONS AUDITED</text>
  </g>

  <g transform="translate(510, 390)">
    <rect width="230" height="56" rx="8" fill="#0A2822" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="24" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="600">SATELLITE ACCURACY</text>
    <text x="20" y="44" fill="#34D399" font-family="sans-serif" font-size="15" font-weight="700">99.7% SENTINEL-2</text>
  </g>
</svg>
