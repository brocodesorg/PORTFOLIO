<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgVault" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06121E"/>
      <stop offset="100%" stop-color="#0A1F30"/>
    </linearGradient>
    <linearGradient id="cyanVault" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="vaultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgVault)"/>

  <!-- Isometric Hexagon Grid -->
  <g opacity="0.1" stroke="#06B6D4" stroke-width="1.5">
    <path d="M400 80 L520 150 L520 290 L400 360 L280 290 L280 150 Z"/>
    <path d="M400 30 L590 140 L590 360 L400 470 L210 360 L210 140 Z"/>
    <path d="M400 130 L480 180 L480 270 L400 320 L320 270 L320 180 Z"/>
  </g>

  <!-- 3D Geometric Shield & Vault Lock -->
  <g filter="url(#vaultGlow)">
    <polygon points="400,120 490,170 490,280 400,340 310,280 310,170" fill="none" stroke="url(#cyanVault)" stroke-width="4"/>
    <polygon points="400,150 460,185 460,260 400,300 340,260 340,185" fill="#0E2A3F" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="400" cy="225" r="28" fill="#06B6D4" fill-opacity="0.3" stroke="#22D3EE" stroke-width="3"/>
    <path d="M392 225 L398 231 L412 217" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Laser Stream Vectors -->
  <path d="M100 225 H310" stroke="#06B6D4" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
  <path d="M490 225 H700" stroke="#06B6D4" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>

  <!-- Data Stream Blocks -->
  <g transform="translate(60, 60)">
    <rect width="220" height="60" rx="8" fill="#081726" stroke="#0E3954" stroke-width="1.5"/>
    <text x="20" y="26" fill="#06B6D4" font-family="monospace" font-size="11" font-weight="600">THRESHOLD MULTI-SIG</text>
    <text x="20" y="46" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="700">7 / 9 VALIDATED</text>
  </g>

  <g transform="translate(520, 380)">
    <rect width="220" height="60" rx="8" fill="#081726" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="20" y="26" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">MEV SHIELD STATUS</text>
    <text x="20" y="46" fill="#22D3EE" font-family="sans-serif" font-size="15" font-weight="700">ZERO FRONTRUNNING</text>
  </g>
</svg>
