<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E112A"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="100" y1="100" x2="700" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="200" y1="100" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Central Synaptic Node Cluster -->
  <g filter="url(#glow)">
    <circle cx="400" cy="240" r="45" fill="url(#pinkGrad)" opacity="0.85"/>
    <circle cx="400" cy="240" r="70" stroke="#EC4899" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
    <circle cx="400" cy="240" r="110" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  </g>

  <!-- Network Interconnections -->
  <g stroke="url(#pinkGrad)" stroke-width="2" opacity="0.65">
    <line x1="400" y1="240" x2="220" y2="150"/>
    <line x1="400" y1="240" x2="250" y2="340"/>
    <line x1="400" y1="240" x2="580" y2="160"/>
    <line x1="400" y1="240" x2="560" y2="350"/>
    <line x1="220" y1="150" x2="130" y2="220"/>
    <line x1="580" y1="160" x2="680" y2="210"/>
  </g>

  <!-- Satellite Nodes -->
  <circle cx="220" cy="150" r="16" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="250" cy="340" r="20" fill="#EC4899" filter="url(#glow)"/>
  <circle cx="580" cy="160" r="22" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="560" cy="350" r="18" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="130" cy="220" r="10" fill="#EC4899"/>
  <circle cx="680" cy="210" r="12" fill="#3B82F6"/>

  <!-- UI Floating Badges -->
  <g transform="translate(60, 40)">
    <rect width="210" height="52" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="6" fill="#10B981"/>
    <text x="42" y="24" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="600">NEURAL TELEMETRY</text>
    <text x="42" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">99.98% COHERENCE</text>
  </g>

  <g transform="translate(530, 400)">
    <rect width="210" height="52" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#EC4899" stroke-width="1.5"/>
    <text x="20" y="24" fill="#EC4899" font-family="monospace" font-size="11" font-weight="600">SYNAPSE BANDWIDTH</text>
    <text x="20" y="40" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">2.4M NODES / SEC</text>
  </g>
</svg>
