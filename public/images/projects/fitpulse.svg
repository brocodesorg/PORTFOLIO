<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFit" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#180C0B"/>
      <stop offset="100%" stop-color="#24110A"/>
    </linearGradient>
    <linearGradient id="orangePulse" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgFit)"/>

  <!-- Concentric Biometric Rings -->
  <g opacity="0.3">
    <circle cx="400" cy="250" r="180" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 9"/>
    <circle cx="400" cy="250" r="140" stroke="#EF4444" stroke-width="1" stroke-dasharray="6 12"/>
    <circle cx="400" cy="250" r="100" stroke="#F43F5E" stroke-width="1.5"/>
  </g>

  <!-- Dynamic ECG Waveform -->
  <path d="M50 250 H240 L260 210 L280 300 L310 120 L340 370 L370 230 L390 260 L410 210 L430 320 L460 160 L480 310 L500 240 L520 260 H750" 
        stroke="url(#orangePulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)"/>

  <!-- Live Pulse Points -->
  <circle cx="310" cy="120" r="7" fill="#F59E0B" filter="url(#pulseGlow)"/>
  <circle cx="340" cy="370" r="7" fill="#EF4444" filter="url(#pulseGlow)"/>
  <circle cx="460" cy="160" r="7" fill="#F43F5E" filter="url(#pulseGlow)"/>

  <!-- UI Floating Metric Badges -->
  <g transform="translate(60, 50)">
    <rect width="210" height="56" rx="8" fill="#2A1412" stroke="#5E231C" stroke-width="1.5"/>
    <text x="20" y="24" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="600">HEART RATE VARIABILITY</text>
    <text x="20" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">68 MS (PEAK STATE)</text>
  </g>

  <g transform="translate(530, 390)">
    <rect width="210" height="56" rx="8" fill="#2A1412" stroke="#EF4444" stroke-width="1.5"/>
    <text x="20" y="24" fill="#EF4444" font-family="monospace" font-size="11" font-weight="600">BLE LATENCY</text>
    <text x="20" y="44" fill="#FBBF24" font-family="sans-serif" font-size="16" font-weight="700">1.2MS REAL-TIME</text>
  </g>
</svg>
